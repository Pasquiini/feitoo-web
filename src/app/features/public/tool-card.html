<article class="home-tool-card" [attr.data-tool-route]="tool().route">
  <a [routerLink]="tool().route" [attr.aria-label]="tool().cta + ': ' + tool().title">
    <div class="tool-top">
      <span class="tool-icon"><app-home-icon [name]="tool().icon" /></span>
      <span class="tool-format" aria-hidden="true">
        {{ tool().inputLabel }} <span>→</span> {{ tool().outputLabel }}
      </span>
    </div>
    <h4>{{ tool().title }}</h4>
    <p class="tool-description">{{ tool().description }}</p>
    <span class="tool-cta">{{ tool().cta }} <app-home-icon name="arrow" /></span>
  </a>
  <button
    type="button"
    class="favorite-toggle"
    [attr.aria-label]="
      (favorite() ? 'Remover ' : 'Adicionar ') +
      tool().title +
      (favorite() ? ' dos favoritos' : ' aos favoritos')
    "
    [attr.aria-pressed]="favorite()"
    (click)="preferences.toggleFavorite(tool().route)"
  >
    <app-home-icon name="star" [filled]="favorite()" />
  </button>
</article>
