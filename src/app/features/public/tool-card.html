<article class="home-tool-card">
  <a [routerLink]="tool().route" [attr.aria-label]="tool().cta + ': ' + tool().title">
    <div class="tool-top">
      <span class="tool-category-label">{{ tool().category }}</span
      ><span class="tool-badge">{{ tool().badge }}</span>
    </div>
    <div class="card-transformation" aria-hidden="true">
      <span>{{ tool().inputLabel }}</span
      ><span class="card-arrow">→</span><strong>{{ tool().outputLabel }}</strong>
    </div>
    <h3>
      @if (tool().icon === 'pdf') {
        <app-home-icon name="pdf" />
      }
      {{ tool().title }}
    </h3>
    <p class="tool-description">{{ tool().description }}</p>
    <ul class="tool-tags" aria-label="Recursos">
      @for (tag of tool().tags; track tag) {
        <li>{{ tag }}</li>
      }
    </ul>
    <div class="tool-bottom">
      <span class="tool-cta">{{ tool().cta }} <app-home-icon name="arrow" /></span>
    </div>
  </a>
</article>
